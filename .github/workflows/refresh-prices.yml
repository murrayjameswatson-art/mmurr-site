# Weekly refresh of js/data/api-prices.js (LiteLLM registry) + monthly refresh
# of js/data/fx-history.js (ECB GBPUSD via frankfurter.dev).
# Manual run: Actions tab → "Refresh API prices" → Run workflow (runs both).
name: Refresh API prices

on:
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — API prices
    - cron: '0 6 1 * *'   # 1st of month 06:00 UTC — GBPUSD FX
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 * * 1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/refresh-prices.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet js/data/api-prices.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add js/data/api-prices.js
            git commit -m "*CLAUDE CODE* Weekly API price refresh (LiteLLM registry)"
            git push
          else
            echo "No price changes this week."
          fi

  refresh-fx:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 6 1 * *'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/refresh-fx.mjs
      - name: Commit if changed
        run: |
          if ! git diff --quiet js/data/fx-history.js; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add js/data/fx-history.js
            git commit -m "*CLAUDE CODE* Monthly GBPUSD FX refresh (ECB via frankfurter.dev)"
            git pull --rebase
            git push
          else
            echo "No FX changes this month."
          fi
